name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check easynoptique tests
      - run: pytest -q
      - name: Génère l'exemple
        run: easynoptique render tests/fixtures/meteo-poche.xml -o build/exemple
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: synoptique-exemple
          path: build/exemple
