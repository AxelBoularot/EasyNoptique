[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "easynoptique"
version = "0.2.1"
description = "Génération automatique de synoptiques (fonctionnel, alimentation, bus) à partir d'un projet KiCad"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Axel Boularot" }]
dependencies = ["pyyaml>=5.4"]
keywords = ["kicad", "synoptique", "block diagram", "drawio", "electronics"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "jsonschema>=4"]

[project.scripts]
easynoptique = "easynoptique.cli:main"

[tool.setuptools.packages.find]
include = ["easynoptique*"]

[tool.ruff]
line-length = 130
target-version = "py38"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP031", "E501", "E731"]
